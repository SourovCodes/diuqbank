name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qb/web exec playwright install --with-deps chromium
      - name: Prepare local API secrets and database
        run: |
          printf "BETTER_AUTH_SECRET=%s\n" "$(openssl rand -base64 32)" > apps/api/.dev.vars
          # Placeholder Google client: the e2e tests stop at Google's (stubbed) sign-in page.
          printf "GOOGLE_CLIENT_ID=e2e-client-id\nGOOGLE_CLIENT_SECRET=e2e-client-secret\n" >> apps/api/.dev.vars
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Once every check has passed: dev deploys staging, main deploys production. Each is
  # skipped until its site URL variable is set (see "Deploying" in the README).
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: >-
      github.event_name == 'push' && (
        (github.ref_name == 'main' && vars.PRODUCTION_SITE_URL != '') ||
        (github.ref_name == 'dev' && vars.STAGING_SITE_URL != '')
      )
    # Never cancel a deploy halfway, and run each site's deploys in push order.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The Wrangler environment: the top level for production, env.staging otherwise.
      CLOUDFLARE_ENV: ${{ github.ref_name == 'main' && '' || 'staging' }}
      SITE_URL: ${{ github.ref_name == 'main' && vars.PRODUCTION_SITE_URL || vars.STAGING_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Schema first, so new code never runs against the old one. Then the API,
      # which the web worker's service binding points at.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"}
      - name: Deploy API worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"} --var "SITE_URL:$SITE_URL"
      # The Vite plugin reads CLOUDFLARE_ENV at build time and writes the resolved
      # config next to the build, which `wrangler deploy` then picks up.
      - name: Deploy web worker
        working-directory: apps/web
        run: pnpm build && pnpm exec wrangler deploy
