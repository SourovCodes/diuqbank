# Weekly update PRs, grouped so each ecosystem opens at most a couple at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The whole pnpm workspace (root lockfile). Minor and patch updates come as one PR;
  # majors get their own, since they may need code changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
